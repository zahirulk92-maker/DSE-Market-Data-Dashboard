services:
  - type: web
    name: dse-market-data-dashboard
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm run typecheck && pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/dse-market-dashboard run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DSE_LATEST_URL
        sync: false
      - key: DSE_HISTORY_URL
        sync: false
  - type: worker
    name: dse-data-collector
    runtime: python
    region: singapore
    plan: starter
    buildCommand: python -m compileall collector
    startCommand: python collector/main.py --loop
    maxShutdownDelaySeconds: 120
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DSE_LATEST_URL
        sync: false
      - key: DSE_HISTORY_URL
        sync: false
      - key: DSE_DATA_SOURCE_TOKEN
        sync: false
      - key: DSE_BACKFILL_BATCH_SIZE
        value: "3"
      - key: DSE_COLLECTION_INTERVAL_SECONDS
        value: "300"
